# Docket CI on GitHub Actions. Stages
# (validate, lint, test, security, build) and every
# gate is `make <target>`, so the Makefile stays the single source of what a
# gate does. GitHub sets CI=true, so a gate whose tool is missing fails here
# instead of printing SKIPPED.
#
# The two-approval rule (one peer, one lead, from CODEOWNERS) is a branch
# protection setting, not something a workflow can enforce: Settings >
# Branches > main and develop: require a pull request, 2 approving reviews,
# review from Code Owners, dismiss stale approvals, and the status checks
# lint, unit, integration, dependency-scan and build.
name: ci

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.11.30"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: branch-name
        if: github.event_name == 'pull_request'
        env: { BRANCH: "${{ github.head_ref }}" }
        run: |
          echo "$BRANCH" | grep -Eq '^(feature|bugfix|hotfix|chore|docs)/[A-Z][A-Z0-9]*(-[0-9]+)+-[A-Za-z0-9]+$|^release/v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "branch-name: 1 branch checked"
      - name: commits
        if: github.event_name == 'pull_request'
        env: { BASE: "${{ github.base_ref }}" }
        run: |
          git fetch origin "$BASE" --depth=200
          range="origin/$BASE..HEAD"
          subjects=$(mktemp)
          git log --no-merges --format=%s "$range" > "$subjects"
          n=$(wc -l < "$subjects" | tr -d ' ')
          [ "$n" -gt 0 ] || { echo "commits: 0 commits in range $range"; exit 1; }
          bad=0
          while IFS= read -r subj; do
            echo "$subj" | grep -Eq '^(feat|fix|refactor|test|docs|chore|perf|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .{1,72}( \[[A-Z][A-Z0-9]*(-[0-9]+)+\])?$' || { echo "bad subject: $subj"; bad=$((bad+1)); }
          done < "$subjects"
          if git log --no-merges --format=%B "$range" | grep -Eiq 'co-authored-by: .*(claude|anthropic|copilot|chatgpt|gemini)|generated with'; then echo "AI attribution trailer found"; exit 1; fi
          echo "commits: $n commits checked, $bad bad"
          [ "$bad" -eq 0 ]

  lint:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [format-check, lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: install
        run: if [ -f uv.lock ]; then uv sync --locked --all-groups; else echo "lockfile:none committed, resolving now (run uv lock and commit uv.lock)"; uv sync --all-groups; fi
      - run: make ${{ matrix.gate }}

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: install
        run: if [ -f uv.lock ]; then uv sync --locked --all-groups; else echo "lockfile:none committed, resolving now (run uv lock and commit uv.lock)"; uv sync --all-groups; fi
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  # Replays the recorded RapidOCR words: no live engine call and no model download (CONSTRAINTS.md 3.1).
  eval-gate:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: install
        run: if [ -f uv.lock ]; then uv sync --locked --all-groups; else echo "lockfile:none committed, resolving now (run uv lock and commit uv.lock)"; uv sync --all-groups; fi
      # evals/ocr/gate.yaml holds an accepted baseline (2026-10-16), so this fails the pipeline
      # when the replayed score falls by more than the delta.
      - run: make eval-gate

  # Needs Postgres, so it is a job here and not part of make check.
  integration:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: app_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: install
        run: if [ -f uv.lock ]; then uv sync --locked --all-groups; else echo "lockfile:none committed, resolving now (run uv lock and commit uv.lock)"; uv sync --all-groups; fi
      # pdf2image shells out to poppler; the app image installs the same package (ADR-0008).
      - name: poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: uv run alembic upgrade head
      - run: make migrate-verify
      - run: make test-integration

  # The live end-to-end suite (NOTASK-31): real API, real Postgres and real RapidOCR behind the built
  # UI, Chromium only. NOT a required check and not in `make check`: add it to the branch-protection
  # list only after it has been green for a week. The Postgres service replaces the compose project
  # that `make test-e2e-live` starts locally; E2E_LIVE_DATABASE_URL tells the target to use it.
  e2e-live:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: docket, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      E2E_LIVE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:55432/docket
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-groups
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-e2e-live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-live-report
          path: |
            frontend/playwright-report/live
            frontend/test-results/live
          if-no-files-found: ignore

  dependency-scan:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: make vuln

  build:
    needs: [unit, integration, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: login to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image tags
        id: tags
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$base:${GITHUB_SHA::7}"
          case "$GITHUB_REF" in refs/tags/*) tags="$tags,$base:${GITHUB_REF#refs/tags/}";; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: 'echo "build: 1 image built (${{ steps.tags.outputs.tags }})"'

  # Continuous deployment (ADR-0019). Runs `make deploy` on a push to main once every required job
  # above has passed. It does nothing until the repository variable DEPLOY_ENABLED is "true", and the
  # `production` environment can require a reviewer (Settings > Environments). e2e-live is not in
  # `needs` until it has been green for a week. The secrets and variables are listed in
  # docs/runbooks/deploy.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [validate, lint, unit, eval-gate, integration, dependency-scan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: skip when a newer commit is already on main
        id: fresh
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer commit is on main; its own run deploys it. Nothing to do here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: server key and pinned host key
        if: steps.fresh.outputs.skip != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          [ -s "$RUNNER_TEMP/deploy_key" ] && [ -s "$RUNNER_TEMP/known_hosts" ] || { echo "deploy: DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set" >&2; exit 1; }
          echo "SSH_OPTS=-i $RUNNER_TEMP/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o ServerAliveInterval=30" >> "$GITHUB_ENV"
      - name: remember the version now running
        if: steps.fresh.outputs.skip != 'true'
        id: previous
        run: |
          prev=$(ssh $SSH_OPTS "$DEPLOY_HOST" "grep '^DOCKET_VERSION=' Docket/deploy/production.env | cut -d= -f2" || true)
          echo "version=$prev" >> "$GITHUB_OUTPUT"
          echo "Running now: ${prev:-unknown}"
      - name: deploy
        if: steps.fresh.outputs.skip != 'true'
        run: make deploy DEPLOY_HOST="$DEPLOY_HOST" DEPLOY_DOMAIN="$DEPLOY_DOMAIN" DEPLOY_KEY="$RUNNER_TEMP/deploy_key" SSH_OPTS="$SSH_OPTS"
      - name: roll back to the previous version
        if: failure() && steps.previous.outputs.version != ''
        run: make deploy-rollback VERSION="${{ steps.previous.outputs.version }}" DEPLOY_HOST="$DEPLOY_HOST" DEPLOY_DOMAIN="$DEPLOY_DOMAIN" DEPLOY_KEY="$RUNNER_TEMP/deploy_key" SSH_OPTS="$SSH_OPTS"
      - name: summary
        if: always() && steps.fresh.outputs.skip != 'true'
        run: |
          {
            echo "### Deploy"
            echo "- commit: $(git rev-parse --short HEAD)"
            echo "- previous: ${{ steps.previous.outputs.version }}"
            echo "- site: https://$DEPLOY_DOMAIN"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
